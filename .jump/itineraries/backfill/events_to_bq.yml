description: "Backfill events from Gorgias API and load them into BigQuery"

partitions:
    temporal:
        start_date: "2025-01-01"
        time_unit: "daily"

satellite:
    tier: medium
    communication:
        timeout: 900

inputs:
    events:
        from_api:
            params:
                start_date: "{{ (datetime.strptime(run.one_month_ago, '%Y-%m-%d') - timedelta(hours=1)).isoformat() }}"
                end_date: "{{ (datetime.strptime(run.today, '%Y-%m-%d') + timedelta(hours=2)).isoformat() }}"
            allow_empty: true

outputs:
    events:
        to_bq:
            validation: true
            allow_empty: true

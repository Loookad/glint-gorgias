schedules:
    timezone: Europe/Rome
    fixed:
        cron: "${{ env.KLAVIYO_CRON }}"

partitions:
    temporal:
        start_date: "${{ env.KLAVIYO_START_DATE }}"
        time_unit: daily

satellite:
    tier: small
    communication:
        timeout: 900


inputs:
    raw_data/klaviyo/lists:
        from_api:
            validation: true

outputs:
    raw_data/klaviyo/lists:
        to_bq:
            validation: true
            allow_empty: true
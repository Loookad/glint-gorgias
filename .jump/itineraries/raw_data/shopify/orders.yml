schedules:
    timezone: Europe/Rome
    fixed:
        cron: "${{ env.SHOPIFY_CRON }}"


partitions:
    temporal:
        start_date: "${{ env.SHOPIFY_START_DATE }}"
        time_unit: "daily"

satellite:
    tier: small
    communication:
        timeout: 900

inputs:
    raw_data/shopify/orders:
        from_api:
            params:
                created_at_min: "{{ (datetime.strptime(run.yesterday, '%Y-%m-%d') - timedelta(hours=1)).isoformat() }}"
                created_at_max: "{{ (datetime.strptime(run.today, '%Y-%m-%d') + timedelta(hours=2)).isoformat() }}"
            allow_empty: true
        from_api_second:
            params:
                created_at_min: "{{ (datetime.strptime(run.yesterday, '%Y-%m-%d') - timedelta(hours=1)).isoformat() }}"
                created_at_max: "{{ (datetime.strptime(run.today, '%Y-%m-%d') + timedelta(hours=2)).isoformat() }}"
            allow_empty: true

compute:
    steps:
        - union_all: 
            sql: 
                query: |
                    SELECT 
                        '${{ env.SHOPIFY_LOCATION_1 }}' AS shopify_account,
                        order_id,
                        order_name,
                        app_id,
                        order_checkout_id,
                        order_created_at,
                        order_closed_at,
                        order_updated_at,
                        order_currency,
                        landing_site,
                        landing_site_ref,
                        order_number,
                        financial_status,
                        order_processed_at,
                        order_note,
                        tags,
                        source_name,
                        source_url,
                        total_price,
                        subtotal_price,
                        total_discounts,
                        total_line_items_price,
                        total_tax,
                        total_shipping_price,
                        total_tip_received,
                        discount_code,
                        discount_amount,
                        discount_type,
                        cart_token,
                        order_checkout_token,
                        cancel_reason,
                        cancelled_at,
                        shipping_country,
                        shipping_country_code,
                        shipping_province,
                        shipping_province_code,
                        shipping_city,
                        shipping_zip,
                        shipping_latitude,
                        shipping_longitude,
                        customer_id,
                        customer_email,
                        mktg_accepted,
                        admin_graphql_api_id,
                        browser_ip,
                        confirmation_number,
                        confirmed,
                        contact_email,
                        currency, 
                        customer_locale,
                        device_id,
                        duties_included,
                        email,
                        estimated_taxes,
                        fulfillment_status,
                        location_id,
                        merchant_business_entity_id,
                        merchant_of_record_app_id,
                        number,
                        order_status_url,
                        phone,
                        po_number,
                        presentment_currency,
                        reference,
                        referring_site,
                        source_identifier,
                        tax_exempt,
                        taxes_included,
                        test,
                        token,
                        total_outstanding,
                        total_weight,
                        user_id,
                        current_subtotal_price,
                        current_total_discounts,
                        current_total_price,
                        current_total_tax,
                        billing_first_name,
                        billing_last_name,
                        billing_address1,
                        billing_address2,
                        billing_city,
                        billing_zip,
                        billing_province,
                        billing_province_code,
                        billing_country,
                        billing_country_code,
                        billing_phone,
                        billing_latitude,
                        billing_longitude,
                        billing_company,
                        billing_name
                    FROM "raw_data/shopify/orders:from_api"
                    UNION ALL
                    SELECT 
                        '${{ env.SHOPIFY_LOCATION_2 }}' AS shopify_account,
                        order_id,
                        order_name,
                        app_id,
                        order_checkout_id,
                        order_created_at,
                        order_closed_at,
                        order_updated_at,
                        order_currency,
                        landing_site,
                        landing_site_ref,
                        order_number,
                        financial_status,
                        order_processed_at,
                        order_note,
                        tags,
                        source_name,
                        source_url,
                        total_price,
                        subtotal_price,
                        total_discounts,
                        total_line_items_price,
                        total_tax,
                        total_shipping_price,
                        total_tip_received,
                        discount_code,
                        discount_amount,
                        discount_type,
                        cart_token,
                        order_checkout_token,
                        cancel_reason,
                        cancelled_at,
                        shipping_country,
                        shipping_country_code,
                        shipping_province,
                        shipping_province_code,
                        shipping_city,
                        shipping_zip,
                        shipping_latitude,
                        shipping_longitude,
                        customer_id,
                        customer_email,
                        mktg_accepted,
                        admin_graphql_api_id,
                        browser_ip,
                        confirmation_number,
                        confirmed,
                        contact_email,
                        currency, 
                        customer_locale,
                        device_id,
                        duties_included,
                        email,
                        estimated_taxes,
                        fulfillment_status,
                        location_id,
                        merchant_business_entity_id,
                        merchant_of_record_app_id,
                        number,
                        order_status_url,
                        phone,
                        po_number,
                        presentment_currency,
                        reference,
                        referring_site,
                        source_identifier,
                        tax_exempt,
                        taxes_included,
                        test,
                        token,
                        total_outstanding,
                        total_weight,
                        user_id,
                        current_subtotal_price,
                        current_total_discounts,
                        current_total_price,
                        current_total_tax,
                        billing_first_name,
                        billing_last_name,
                        billing_address1,
                        billing_address2,
                        billing_city,
                        billing_zip,
                        billing_province,
                        billing_province_code,
                        billing_country,
                        billing_country_code,
                        billing_phone,
                        billing_latitude,
                        billing_longitude,
                        billing_company,
                        billing_name
                    FROM "raw_data/shopify/orders:from_api_second"


outputs:
    raw_data/shopify/orders:
        to_bq:
            validation: true
            allow_empty: true

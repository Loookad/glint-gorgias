description: "Extract daily events from Gorgias API and load them into BigQuery"

schedules:
    timezone: Europe/Rome
    fixed:
        cron: '0 0 * * *'

satellite:
    tier: small
    communication:
        timeout: 900

inputs:
    events:
        from_api:
            params:
                start_date: "{{ (datetime.strptime(run.yesterday, '%Y-%m-%d') - timedelta(hours=1)).isoformat() }}"
                end_date: "{{ (datetime.strptime(run.today, '%Y-%m-%d') + timedelta(hours=2)).isoformat() }}"
            allow_empty: true

outputs:
    events:
        to_bq:
            validation: true
            allow_empty: true

description: |
    Resource that maps the api Meta Ad Insights.
    Demo stands for demographic as the data is extracted with age and gender dimensions.

metadata:
    documentation: https://developers.facebook.com/docs/marketing-api/reference/adgroup/insights/

schema:
    fields:
        partition_date:
            type: date32
            is_partition_key: true
        kelpie_date:
            type: date32
        meta_account:
            type: string
        account_id:
            type: string
        account_currency:
            type: string
        campaign_id:
            type: string
        campaign_name:
            type: string
        optimization_goal:
            type: string
        ad_id:
            type: string
        ad_name:
            type: string
        spend:
            type: double
        impressions:
            type: int64
        clicks:
            type: int64
        outbound_clicks:
            type: int64
        unique_clicks:
            type: double
        unique_outbound_clicks:
            type: double
        reach:
            type: double
        frequency:
            type: double
        purchases:
            type: double
        add_to_carts:
            type: double
        link_clicks:
            type: double
        age:
            type: string
        gender:
            type: string

from_api:
    location: ${{ env.META_LOCATION_1 }}
    description: Meta Marketing API for advertising spend metrics
    api:
        request:
            path: /v24.0/act_${{ env.META_ACCOUNT_1 }}/insights
            query_params:
                time_range: |
                    {"since":"${{ param.from_date }}","until":"${{ param.to_date }}"}
                time_increment: 1
                fields: >
                    account_id,
                    account_currency,
                    campaign_name,
                    campaign_id,
                    optimization_goal,
                    ad_id,
                    ad_name,
                    spend,
                    impressions,
                    clicks,
                    outbound_clicks,
                    unique_clicks,
                    unique_outbound_clicks,
                    reach,
                    frequency,
                    actions,
                    action_values
                action_breakdowns: action_type
                breakdowns: age, gender
                level: ad
                limit: ${{ env.META_LIMIT_1 }}
        pagination:
            strategy: cursor_pagination
            cursor:
                position: body
                query: paging.cursors.after
                injection:
                    position: query_parameters
                    param_name: after
        response:
            query: |
                (([data, @][?type(@) == 'array'])[0])[].{
                    partition_date: date_start,
                    kelpie_date: date_stop,
                    account_id: account_id,
                    account_currency: account_currency,
                    campaign_name: campaign_name,
                    campaign_id: campaign_id,
                    ad_name: ad_name,
                    ad_id: ad_id,
                    optimization_goal: optimization_goal,
                    spend: spend,
                    impressions: impressions,
                    clicks: clicks,
                    outbound_clicks: outbound_clicks[?action_type=='outbound_click'].value | [0],
                    unique_clicks: unique_clicks,
                    unique_outbound_clicks: unique_outbound_clicks[?action_type=='outbound_click'].value | [0],
                    reach: reach,
                    frequency: frequency,
                    purchases: actions[?action_type=='omni_purchase'].value | [0],
                    add_to_carts: actions[?action_type=='omni_add_to_cart'].value | [0],
                    link_clicks: actions[?action_type=='link_click'].value | [0],
                    age: age,
                    gender: gender
                }


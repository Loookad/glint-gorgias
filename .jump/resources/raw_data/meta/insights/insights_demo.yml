# This variant uses "merge_with_side_table:" operation to merge the new data with the table already existing on BigQuery.
# When running the itinerary for the first time, or when the table on BigQuery is empty, comment all lines starting from "merge_with_side_table:" and use instead "replace".
# After the first data uploaded to the table, return to using "merge_with_side_table:".
# Documentation on writing to a database: https://jump.hiop.io/docs/reference/core/resource/connectors/sql/#write-data-to-a-database
to_bq:
    location: hiop_project_raw
    sql:
        table: ${{ env.WORKSPACE }}_meta.insights_demo
        if_exists:
            merge_with_side_table:
                side_table: ${{ env.WORKSPACE }}_meta.insights_demo_tmp_upsert
                query: |
                    MERGE `${{ env.WORKSPACE }}_meta.insights_demo` sp
                    USING `${{ env.WORKSPACE }}_meta.insights_demo_tmp_upsert` tmp
                    ON sp.ad_id = tmp.ad_id AND sp.kelpie_date = tmp.kelpie_date AND sp.age = tmp.age AND sp.gender = tmp.gender AND sp.account_id = tmp.account_id
                    WHEN MATCHED THEN
                    UPDATE SET
                        partition_date = tmp.partition_date,
                        kelpie_date = tmp.kelpie_date,
                        meta_account = tmp.meta_account,
                        account_id = tmp.account_id,
                        account_currency = tmp.account_currency,
                        campaign_id = tmp.campaign_id,
                        campaign_name = tmp.campaign_name,
                        optimization_goal = tmp.optimization_goal,
                        ad_id = tmp.ad_id,
                        ad_name = tmp.ad_name,
                        spend = tmp.spend,
                        impressions = tmp.impressions,
                        clicks = tmp.clicks,
                        outbound_clicks = tmp.outbound_clicks,
                        unique_clicks = tmp.unique_clicks,
                        unique_outbound_clicks = tmp.unique_outbound_clicks,
                        reach = tmp.reach,
                        frequency = tmp.frequency,
                        purchases = tmp.purchases,
                        add_to_carts = tmp.add_to_carts,
                        link_clicks = tmp.link_clicks,
                        age = tmp.age,
                        gender = tmp.gender
                    WHEN NOT MATCHED THEN
                    INSERT (
                        partition_date,kelpie_date,campaign_id,account_id,meta_account,account_currency,campaign_name,optimization_goal,ad_id,ad_name,
                        spend,impressions,clicks,outbound_clicks,unique_clicks,unique_outbound_clicks,reach,
                        frequency,purchases,add_to_carts,link_clicks,age,gender
                    )
                    VALUES (
                        tmp.partition_date,tmp.kelpie_date,tmp.campaign_id,tmp.account_id,tmp.meta_account,tmp.account_currency,tmp.campaign_name,tmp.optimization_goal,tmp.ad_id,
                        tmp.ad_name,tmp.spend,tmp.impressions,tmp.clicks,tmp.outbound_clicks,tmp.unique_clicks,
                        tmp.unique_outbound_clicks,tmp.reach,tmp.frequency,tmp.purchases,tmp.add_to_carts,
                        tmp.link_clicks,tmp.age,tmp.gender
                    );

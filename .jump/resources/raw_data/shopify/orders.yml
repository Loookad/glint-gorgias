            type: string
        po_number:
            type: string
        presentment_currency:
            type: string
        reference:
            type: string
        referring_site:
            type: string
        source_identifier:
            type: string
        tax_exempt:
            type: boolean
        taxes_included:
            type: boolean
        test:
            type: boolean

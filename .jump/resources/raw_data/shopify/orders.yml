# This variant uses "merge_with_side_table:" operation to merge the new data with the table already existing on BigQuery. 
# When running the itinerary for the first time, or when the table on BigQuery is empty, comment all lines starting from "merge_with_side_table:" and use instead "replace". 
# After the first data uploaded to the table, return to using "merge_with_side_table:".
# Documentation on writing to a database: https://jump.hiop.io/docs/reference/core/resource/connectors/sql/#write-data-to-a-database
to_bq:
    location: hiop_project_raw
    sql:
        table: ${{ env.WORKSPACE }}_shopify.orders
        if_exists:
            merge_with_side_table:
                side_table: ${{ env.WORKSPACE }}_shopify.orders_tmp_upsert
                query: |
                    MERGE `${{ env.WORKSPACE }}_shopify.orders` sp
                    USING `${{ env.WORKSPACE }}_shopify.orders_tmp_upsert` tmp
                    ON sp.order_id = tmp.order_id AND sp.shopify_account = tmp.shopify_account
                    WHEN MATCHED THEN
                    UPDATE SET
                        order_name                 = tmp.order_name,
                        app_id                     = tmp.app_id,
                        order_checkout_id          = tmp.order_checkout_id,
                        order_created_at           = tmp.order_created_at,
                        order_closed_at            = tmp.order_closed_at,
                        order_updated_at           = tmp.order_updated_at,
                        order_currency             = tmp.order_currency,
                        landing_site               = tmp.landing_site,
                        landing_site_ref           = tmp.landing_site_ref,
                        order_number               = tmp.order_number,
                        financial_status           = tmp.financial_status,
                        order_processed_at         = tmp.order_processed_at,
                        order_note                 = tmp.order_note,
                        tags                       = tmp.tags,
                        source_name                = tmp.source_name,
                        source_url                 = tmp.source_url,
                        total_price                = tmp.total_price,
                        subtotal_price             = tmp.subtotal_price,
                        total_discounts            = tmp.total_discounts,
                        total_line_items_price     = tmp.total_line_items_price,
                        total_tax                  = tmp.total_tax,
                        total_shipping_price       = tmp.total_shipping_price,
                        total_tip_received         = tmp.total_tip_received,
                        discount_code              = tmp.discount_code,
                        discount_amount            = tmp.discount_amount,
                        discount_type              = tmp.discount_type,
                        cart_token                 = tmp.cart_token,
                        order_checkout_token       = tmp.order_checkout_token,
                        cancel_reason              = tmp.cancel_reason,
                        cancelled_at               = tmp.cancelled_at,
                        shipping_country           = tmp.shipping_country,
                        shipping_country_code      = tmp.shipping_country_code,
                        shipping_province          = tmp.shipping_province,
                        shipping_province_code     = tmp.shipping_province_code,
                        shipping_city              = tmp.shipping_city,
                        shipping_zip               = tmp.shipping_zip,
                        shipping_latitude          = tmp.shipping_latitude,
                        shipping_longitude         = tmp.shipping_longitude,
                        customer_id                = tmp.customer_id,
                        customer_email             = tmp.customer_email,
                        mktg_accepted              = tmp.mktg_accepted,
                        admin_graphql_api_id       = tmp.admin_graphql_api_id,
                        browser_ip                 = tmp.browser_ip,
                        confirmation_number        = tmp.confirmation_number,
                        confirmed                  = tmp.confirmed,
                        contact_email              = tmp.contact_email,
                        currency                   = tmp.currency,
                        customer_locale            = tmp.customer_locale,
                        device_id                  = tmp.device_id,
                        duties_included            = tmp.duties_included,
                        email                      = tmp.email,
                        estimated_taxes            = tmp.estimated_taxes,
                        fulfillment_status         = tmp.fulfillment_status,
                        location_id                = tmp.location_id,
                        merchant_business_entity_id= tmp.merchant_business_entity_id,
                        merchant_of_record_app_id  = tmp.merchant_of_record_app_id,
                        number                     = tmp.number,
                        order_status_url           = tmp.order_status_url,
                        phone                      = tmp.phone,
                        po_number                  = tmp.po_number,
                        presentment_currency       = tmp.presentment_currency,
                        reference                  = tmp.reference,
                        referring_site             = tmp.referring_site,
                        source_identifier          = tmp.source_identifier,
                        tax_exempt                 = tmp.tax_exempt,
                        taxes_included             = tmp.taxes_included,
                        test                       = tmp.test,
                        token                      = tmp.token,
                        total_outstanding          = tmp.total_outstanding,
                        total_weight               = tmp.total_weight,
                        user_id                    = tmp.user_id,
                        current_subtotal_price     = tmp.current_subtotal_price,
                        current_total_discounts    = tmp.current_total_discounts,
                        current_total_price        = tmp.current_total_price,
                        current_total_tax          = tmp.current_total_tax,
                        billing_first_name         = tmp.billing_first_name,
                        billing_last_name          = tmp.billing_last_name,
                        billing_address1           = tmp.billing_address1,
                        billing_address2           = tmp.billing_address2,
                        billing_city               = tmp.billing_city,
                        billing_zip                = tmp.billing_zip,
                        billing_province           = tmp.billing_province,
                        billing_province_code      = tmp.billing_province_code,
                        billing_country            = tmp.billing_country,
                        billing_country_code       = tmp.billing_country_code,
                        billing_phone              = tmp.billing_phone,
                        billing_latitude           = tmp.billing_latitude,
                        billing_longitude          = tmp.billing_longitude,
                        billing_company            = tmp.billing_company,
                        billing_name               = tmp.billing_name
                    WHEN NOT MATCHED THEN
                    INSERT (
                        order_id, order_name, app_id, order_checkout_id, order_created_at, order_closed_at, order_updated_at, order_currency,
                        landing_site, landing_site_ref, order_number, financial_status, order_processed_at, order_note, tags, source_name,

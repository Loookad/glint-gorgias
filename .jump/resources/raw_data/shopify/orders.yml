            type: boolean
        admin_graphql_api_id:
            type: string
        browser_ip:
            type: string
        confirmation_number:
            type: string
        confirmed:
            type: boolean
        contact_email:
            type: string
        currency:
            type: string 
        customer_locale:
            type: string
        device_id:
            type: string
        duties_included:
            type: boolean

                        total_tip_received, discount_code, discount_amount, discount_type, cart_token, order_checkout_token, cancel_reason,
                        cancelled_at, shipping_country, shipping_country_code, shipping_province, shipping_province_code, shipping_city,
                        shipping_zip, shipping_latitude, shipping_longitude, customer_id, customer_email, mktg_accepted,
                        admin_graphql_api_id, browser_ip, confirmation_number, confirmed, contact_email, currency, customer_locale, device_id,
                        duties_included, email, estimated_taxes, fulfillment_status, location_id, merchant_business_entity_id,
                        merchant_of_record_app_id, number, order_status_url, phone, po_number, presentment_currency, reference, referring_site,
                        source_identifier, tax_exempt, taxes_included, test, token, total_outstanding, total_weight, user_id,
                        current_subtotal_price, current_total_discounts, current_total_price, current_total_tax,
                        billing_first_name, billing_last_name, billing_address1, billing_address2, billing_city, billing_zip,
                        billing_province, billing_province_code, billing_country, billing_country_code, billing_phone,
                        billing_latitude, billing_longitude, billing_company, billing_name, shopify_account
                    )
                    VALUES (
                        tmp.order_id, tmp.order_name, tmp.app_id, tmp.order_checkout_id, tmp.order_created_at, tmp.order_closed_at, tmp.order_updated_at, tmp.order_currency,
                        tmp.landing_site, tmp.landing_site_ref, tmp.order_number, tmp.financial_status, tmp.order_processed_at, tmp.order_note, tmp.tags, tmp.source_name,
                        tmp.source_url, tmp.total_price, tmp.subtotal_price, tmp.total_discounts, tmp.total_line_items_price, tmp.total_tax, tmp.total_shipping_price,
                        tmp.total_tip_received, tmp.discount_code, tmp.discount_amount, tmp.discount_type, tmp.cart_token, tmp.order_checkout_token, tmp.cancel_reason,
                        tmp.cancelled_at, tmp.shipping_country, tmp.shipping_country_code, tmp.shipping_province, tmp.shipping_province_code, tmp.shipping_city,
                        tmp.shipping_zip, tmp.shipping_latitude, tmp.shipping_longitude, tmp.customer_id, tmp.customer_email, tmp.mktg_accepted,
                        tmp.admin_graphql_api_id, tmp.browser_ip, tmp.confirmation_number, tmp.confirmed, tmp.contact_email, tmp.currency, tmp.customer_locale, tmp.device_id,
                        tmp.duties_included, tmp.email, tmp.estimated_taxes, tmp.fulfillment_status, tmp.location_id, tmp.merchant_business_entity_id,
                        tmp.merchant_of_record_app_id, tmp.number, tmp.order_status_url, tmp.phone, tmp.po_number, tmp.presentment_currency, tmp.reference, tmp.referring_site,
                        tmp.source_identifier, tmp.tax_exempt, tmp.taxes_included, tmp.test, tmp.token, tmp.total_outstanding, tmp.total_weight, tmp.user_id,
                        tmp.current_subtotal_price, tmp.current_total_discounts, tmp.current_total_price, tmp.current_total_tax,
                        tmp.billing_first_name, tmp.billing_last_name, tmp.billing_address1, tmp.billing_address2, tmp.billing_city, tmp.billing_zip,
                        tmp.billing_province, tmp.billing_province_code, tmp.billing_country, tmp.billing_country_code, tmp.billing_phone,
                        tmp.billing_latitude, tmp.billing_longitude, tmp.billing_company, tmp.billing_name, tmp.shopify_account
                    );


            type: double
        billing_longitude:
            type: double
        billing_company:
            type: string
        billing_name:
            type: string

from_api:
    location: ${{ env.SHOPIFY_LOCATION_1 }}_shopify
    api:
        request:
            path: "/admin/api/2025-07/orders.json?\
                ${{ env.EMPTY_RESPONSE_SHOPIFY_CALL_1 }}&\
                created_at_max=${{ param.created_at_max }}&\
                created_at_min=${{ param.created_at_min }}&\
                status=any&\
                limit=250"
        response:
            query: |
                (([orders, @][?type(@) == 'array'])[0])[].{
                    order_id: id,
                    admin_graphql_api_id: admin_graphql_api_id,
                    app_id: app_id,
                    order_name: name,
                    order_number: order_number,
                    number: number,
                    order_created_at: created_at,
                    order_closed_at: closed_at,
                    order_updated_at: updated_at,
                    order_processed_at: processed_at,
                    financial_status: financial_status,
                    fulfillment_status: fulfillment_status,
                    confirmed: confirmed,
                    test: test,
                    cancel_reason: cancel_reason,
                    cancelled_at: cancelled_at,
                    mktg_accepted: buyer_accepts_marketing,
                    tax_exempt: tax_exempt,
                    taxes_included: taxes_included,
                    duties_included: duties_included,
                    estimated_taxes: estimated_taxes,
                    token: token,
                    cart_token: cart_token,
                    order_checkout_id: checkout_id,
                    order_checkout_token: checkout_token,
                    confirmation_number: confirmation_number,
                    reference: reference,
                    source_identifier: source_identifier,
                    order_status_url: order_status_url,
                    source_name: source_name,
                    source_url: source_url,
                    landing_site: landing_site,
                    landing_site_ref: landing_site_ref,
                    referring_site: referring_site,
                    browser_ip: browser_ip,
                    device_id: device_id,
                    location_id: location_id,
                    user_id: user_id,
                    merchant_business_entity_id: merchant_business_entity_id,
                    merchant_of_record_app_id: merchant_of_record_app_id,
                    po_number: po_number,
                    contact_email: contact_email,
                    email: email,
                    customer_email: email,
                    phone: phone,
                    customer_locale: customer_locale,
                    order_currency: currency,
                    currency: currency,
                    presentment_currency: presentment_currency,
                    total_price: total_price,
                    subtotal_price: subtotal_price,
                    total_discounts: total_discounts,
                    total_line_items_price: total_line_items_price,
                    total_tax: total_tax,
                    total_tip_received: total_tip_received,
                    total_outstanding: total_outstanding,
                    total_weight: total_weight,
                    current_subtotal_price: current_subtotal_price,
                    current_total_discounts: current_total_discounts,
                    current_total_price: current_total_price,
                    current_total_tax: current_total_tax,
                    total_shipping_price: total_shipping_price_set.shop_money.amount,
                    discount_code: discount_codes[0].code,
                    discount_amount: discount_codes[0].amount,
                    discount_type: discount_codes[0].type,
                    order_note: note,
                    tags: tags,
                    shipping_country: shipping_address.country,
                    shipping_country_code: shipping_address.country_code,
                    shipping_province: shipping_address.province,
                    shipping_province_code: shipping_address.province_code,
                    shipping_city: shipping_address.city,
                    shipping_zip: shipping_address.zip,
                    shipping_latitude: shipping_address.latitude,
                    shipping_longitude: shipping_address.longitude,
                    billing_first_name: billing_address.first_name,
                    billing_last_name: billing_address.last_name,
                    billing_address1: billing_address.address1,
                    billing_address2: billing_address.address2,
                    billing_city: billing_address.city,
                    billing_zip: billing_address.zip,
                    billing_province: billing_address.province,
                    billing_province_code: billing_address.province_code,
                    billing_country: billing_address.country,
                    billing_country_code: billing_address.country_code,
                    billing_phone: billing_address.phone,
                    billing_latitude: billing_address.latitude,
                    billing_longitude: billing_address.longitude,
                    billing_company: billing_address.company,
                    billing_name: billing_address.name,
                    customer_id: customer.id
                }
        pagination:
            cursor:
                position: header
                key: link
                regex: |
                    <([^>]+)>;\s*rel=\"next\"
                injection:
                    position: path
            strategy: cursor_pagination
            per_request_config:
                interval: 0.5
                global_timeout: 900


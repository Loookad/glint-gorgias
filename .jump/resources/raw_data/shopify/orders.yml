            type: timestamp[s,UTC]
        order_note:
            type: string
        tags:
            type: string
        source_name:
            type: string
        source_url:
            type: string
        total_price:
            type: double
        subtotal_price:
            type: double
        total_discounts:
            type: double
        total_line_items_price:
            type: double
        total_tax:
            type: double
        total_shipping_price:
            type: double
        total_tip_received:
            type: double
        discount_code:
            type: string
        discount_amount:
            type: double
        discount_type:
            type: string
        cart_token:
            type: string
        order_checkout_token:
            type: string
        cancel_reason:
            type: string
        cancelled_at:
            type: timestamp[s,UTC]
        shipping_country:
            type: string
        shipping_country_code:
            type: string
        shipping_province:
            type: string
        shipping_province_code:
            type: string
        shipping_city:
            type: string
        shipping_zip:
            type: string

metadata:
    documentation: https://developers.google.com/google-ads/api/fields/v22/campaign

schema:
    fields:
        gads_account:
            type: string
        segments_date:
            type: date32
        campaign_id:
            type: string
        campaign_name:
            type: string
        ad_group_ad_ad_id:
            type: string
        ad_group_ad_ad_name:
            type: string
        metrics_cost_micros:
            type: int64
        metrics_impressions:
            type: int64
        metrics_conversions:
            type: double
        metrics_clicks:
            type: int64

to_bq:
    location: hiop_project_raw
    sql:
        table: ${{ env.WORKSPACE }}_google_ads.ad_group_ad
        if_exists: 
            merge_with_side_table:
                side_table: ${{ env.WORKSPACE }}_google_ads.ad_group_ad_tmp_upsert
                query: |
                    MERGE `${{ env.WORKSPACE }}_google_ads.ad_group_ad` sp
                    USING `${{ env.WORKSPACE }}_google_ads.ad_group_ad_tmp_upsert` tmp
                    ON sp.segments_date = tmp.segments_date AND sp.gads_account = tmp.gads_account AND sp.campaign_id = tmp.campaign_id AND sp.ad_group_ad_ad_id = tmp.ad_group_ad_ad_id
                    WHEN MATCHED THEN
                    UPDATE SET
                        segments_date = tmp.segments_date,
                        campaign_id = tmp.campaign_id,
                        campaign_name = tmp.campaign_name,
                        ad_group_ad_ad_id = tmp.ad_group_ad_ad_id,
                        ad_group_ad_ad_name = tmp.ad_group_ad_ad_name,
                        metrics_cost_micros = tmp.metrics_cost_micros,
                        metrics_impressions = tmp.metrics_impressions,
                        metrics_conversions = tmp.metrics_conversions,
                        metrics_clicks = tmp.metrics_clicks


                    WHEN NOT MATCHED THEN
                    INSERT (
                        segments_date, campaign_id, campaign_name, ad_group_ad_ad_id, ad_group_ad_ad_name, 
                        metrics_cost_micros, metrics_impressions, metrics_conversions, metrics_clicks, gads_account
                    )
                    VALUES (
                        tmp.segments_date, tmp.campaign_id, tmp.campaign_name, tmp.ad_group_ad_ad_id, 
                        tmp.ad_group_ad_ad_name, tmp.metrics_cost_micros, tmp.metrics_impressions, tmp.metrics_conversions, tmp.metrics_clicks, tmp.gads_account
                    );


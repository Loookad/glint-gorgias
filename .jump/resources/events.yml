description: "Events data from Gorgias API"

schema:
    fields:
        id:
            type: int64
        uri:
            type: string
        context:
            type: string
        created_datetime:
            type: string
        data:
            type: string
            is_nullable: true
        object_id:
            type: int64
        object_type:
            type: string
        type:
            type: string
        user_id:
            type: int64
            is_nullable: true

from_api:
    location: gorgias_training
    api:
        request:
            path: "events"
            query_params:
                created_datetime[gte]: "${{ param.start_date }}"
                created_datetime[lt]: "${{ param.end_date }}"
                limit: 100
                order_by: created_datetime:desc
        response:
            query: >-
                data[].{
                id: id,
                uri: uri,
                context: context,
                created_datetime: created_datetime,
                data: data,
                object_id: object_id,
                object_type: object_type,
                type: type,
                user_id: user_id
                }
        pagination:
            strategy: cursor_pagination
            cursor:
                position: body
                query: meta.next_cursor
                injection:
                    position: query_parameters
                    param_name: cursor
            per_request_config:
                interval: 0.5

to_bq:
    location: hiop_project_raw
    sql:
        table: test.gorgias_events
        if_exists: append

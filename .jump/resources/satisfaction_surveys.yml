description: "Satisfaction surveys data from Gorgias API"

schema:
    fields:
        id:
            type: int64
        uri:
            type: string
        body_text:
            type: string
            is_nullable: true
        created_datetime:
            type: string
        customer_id:
            type: int64
        meta:
            type: string
            is_nullable: true
        score:
            type: int64
            is_nullable: true
        scored_datetime:
            type: string
            is_nullable: true
        sent_datetime:
            type: string
            is_nullable: true
        should_send_datetime:
            type: string
            is_nullable: true
        ticket_id:
            type: int64

from_api:
    location: gorgias_training
    api:
        request:
            path: satisfaction-surveys
            query_params:
                limit: 100
                order_by: created_datetime:desc
        response:
            query: >-
                data[].{
                id: id,
                uri: uri,
                body_text: body_text,
                created_datetime: created_datetime,
                customer_id: customer_id,
                meta: meta,
                score: score,
                scored_datetime: scored_datetime,
                sent_datetime: sent_datetime,
                should_send_datetime: should_send_datetime,
                ticket_id: ticket_id
                }
        pagination:
            strategy: cursor_pagination
            cursor:
                position: body
                query: meta.next_cursor
                injection:
                    position: query_parameters
                    param_name: cursor
            per_request_config:
                interval: 0.5

to_bq:
    location: hiop_project_raw
    sql:
        table: test.gorgias_satisfaction_surveys
        if_exists: replace
